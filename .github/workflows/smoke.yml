name: Smoke

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose*.yml
      - Caddyfile
      - deploy/**
      - cmd/**
      - internal/**
      - web/**
      - go.mod
      - go.sum
      - scripts/smoke.sh
      - .github/workflows/smoke.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose*.yml
      - Caddyfile
      - deploy/**
      - cmd/**
      - internal/**
      - web/**
      - go.mod
      - go.sum
      - scripts/smoke.sh
      - .github/workflows/smoke.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test
        run: ./scripts/smoke.sh
