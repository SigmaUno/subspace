name: Postgres parity

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  postgres:
    name: Go tests on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: subspace
          POSTGRES_PASSWORD: subspace
          POSTGRES_DB: subspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subspace -d subspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUBSPACE_TEST_PG_DSN: postgres://subspace:subspace@localhost:5432/subspace?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go test -race (packages that open a store)
        run: |
          pkgs="$(go list -f '{{.ImportPath}} {{join .TestImports " "}} {{join .XTestImports " "}}' ./... |
            grep -E 'internal/(servertest|testdb)|internal/store/postgres' | cut -d' ' -f1)"
          go test -race -count=1 -p 2 -timeout 25m $pkgs ./internal/store/... ./cmd/subspace 2>&1 | tee test-postgres.log
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-test-postgres-log
          path: test-postgres.log
          retention-days: 7
