name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: runners
    timeout-minutes: 3
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          files=""
          if [ "$EVENT" = pull_request ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" HEAD)"
            all=false
          else
            all=true
          fi
          match() {
            [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$1"
          }
          emit() {
            if match "$2"; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            emit go '^(\.github/workflows/|Makefile$|go\.(mod|sum)$|\.golangci[^/]*$|cmd/|internal/|testdata/|scripts/|deploy/|examples/)'
            emit web '^(web/|\.github/workflows/)'
            emit docker '^(Dockerfile|docker-compose\.yml|Caddyfile|\.dockerignore|deploy/|web/|scripts/|cmd/|internal/|go\.mod|go\.sum|\.github/workflows/)'
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: runners
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.15.0

  test:
    name: Go test (race) shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: runners
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go test -race
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pkgs="$(go list ./... | awk -v s="$SHARD" 'NR % 4 == s')"
          go test -race -count=1 -timeout 20m $pkgs 2>&1 | tee test.log
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-test-log-${{ matrix.shard }}
          path: test.log
          retention-days: 7

  loadtest-short:
    name: Short loadtest (50 agents, 20s)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: runners
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: make loadtest-short
        run: make loadtest-short 2>&1 | tee loadtest.log
      - name: Upload loadtest log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loadtest-log
          path: loadtest.log
          retention-days: 7

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: runners
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  web:
    name: Web (lint, typecheck, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: runners
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build 2>&1 | tee build.log
      - name: Upload web log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-build-log
          path: web/build.log
          retention-days: 7

  web-audit:
    name: pnpm audit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: runners
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: web/package.json
      - name: Audit (all severities, non-blocking)
        run: |
          if ! pnpm audit --prod; then
            echo "::warning title=pnpm audit::vulnerabilities reported in production dependencies"
          fi
      - name: Audit (high and critical, blocking)
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Validate Compose and shared Caddy
        run: |
          docker compose config --quiet
          docker compose --profile standalone config --quiet
          docker run --rm -v "$PWD/deploy/caddy/subspace.caddy:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build SQLite backup image
        run: docker build --target backup -t subspace-backup:ci .
      - name: Build server image
        run: docker build -t subspace-server:ci -f Dockerfile .
      - name: Build web image
        run: docker build -t subspace-web:ci -f web/Dockerfile web

  ci-ok:
    name: ci-ok
    needs: [changes, lint, test, loadtest-short, govulncheck, web, web-audit, docker]
    if: always()
    runs-on: runners
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
