name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  binaries:
    name: Binaries and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: make release-dist VERSION="$VERSION"
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/changelog.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*-linux-* dist/SHA256SUMS --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  images:
    name: Images (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            file: Dockerfile
            target: server
          - image: web
            context: web
            file: web/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sigmauno/subspace-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/sigmauno/subspace-${{ matrix.image }}:latest
