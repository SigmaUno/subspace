name: Acceptance on Postgres

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - scripts/acceptance-pg.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  acceptance:
    name: Acceptance swarm (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [acceptance-pg, acceptance-ha]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: subspace
          POSTGRES_PASSWORD: subspace
          POSTGRES_DB: subspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subspace -d subspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUBSPACE_TEST_PG_DSN: postgres://subspace@localhost:5432/subspace?sslmode=disable
      PGPASSWORD: subspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}
